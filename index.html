<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雙平台聊天室</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: sans-serif;
    overflow: hidden;
}

/* 上方輸入列 */
.bar {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 999;
    display: flex;
    gap: 8px;
}

input {
    padding: 12px;
    border: none;
    border-radius: 8px;
    width: 260px;
    font-size: 18px;   /* 🔥 放大 */
}

button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #9147ff;
    color: #fff;
    cursor: pointer;
    font-size: 18px;   /* 🔥 放大 */
    font-weight: bold;
}

/* 全螢幕按鈕 */
.fs {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 999;
    padding: 10px 14px;
    background: #9147ff;
    border: none;
    color: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}

.container {
    display: flex;
    height: 100vh;
    width: 100vw;
}

.box {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* 🔥 標題變大 */
h3 {
    margin: 0;
    padding: 10px;
    font-size: 18px;
    background: #111;
    color: #aaa;
}

/* 聊天 iframe */
iframe {
    flex: 1;
    border: none;
    width: 100%;
}

/* 📱 手機直排 */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    h3 {
        font-size: 20px;
    }

    input {
        width: 180px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="bar">
    <input id="ytId" placeholder="輸入 YouTube 影片 ID">
    <button onclick="load()">載入</button>
</div>

<button class="fs" onclick="toggleFS()">全螢幕</button>

<div class="container">
    <div class="box">
        <h3>YouTube Chat</h3>
        <iframe id="yt"></iframe>
    </div>

    <div class="box">
        <h3>Twitch Chat (jeff_jian_57)</h3>
        <iframe id="tw"></iframe>
    </div>
</div>

<script>
const TWITCH_CHANNEL = "jeff_jian_57";

window.onload = () => {
    document.getElementById("ytId").value =
        localStorage.getItem("ytId") || "";
};

function load() {
    const ytId = document.getElementById("ytId").value;
    const parent = window.location.hostname || "127.0.0.1";

    localStorage.setItem("ytId", ytId);

    if (ytId) {
        document.getElementById("yt").src =
            `https://www.youtube.com/live_chat?v=${ytId}&embed_domain=${parent}`;
    }

    document.getElementById("tw").src =
        `https://www.twitch.tv/embed/${TWITCH_CHANNEL}/chat?parent=${parent}`;
}

function toggleFS() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
