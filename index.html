<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雙平台聊天室</title>

<style>
    body {
        margin: 0;
        background: #000;
        font-family: sans-serif;
        overflow: hidden;
    }

    /* 上方控制列（只有YT輸入） */
    .bar {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 999;
        display: flex;
        gap: 8px;
    }

    input {
        padding: 8px;
        border: none;
        border-radius: 6px;
        width: 220px;
    }

    button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #9147ff;
        color: #fff;
        cursor: pointer;
    }

    .container {
        display: flex;
        height: 100vh;
        width: 100vw;
    }

    .box {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    iframe {
        flex: 1;
        border: none;
        width: 100%;
    }

    h3 {
        margin: 0;
        padding: 6px;
        font-size: 12px;
        background: #111;
        color: #aaa;
    }

    /* 手機直排 */
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }
    }

    /* 全螢幕按鈕 */
    .fs {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 999;
        padding: 8px 12px;
        background: #9147ff;
        border: none;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
    }
</style>
</head>

<body>

<!-- 只有YT輸入框 -->
<div class="bar">
    <input id="ytId" placeholder="輸入 YouTube 影片 ID">
    <button onclick="load()">載入</button>
</div>

<button class="fs" onclick="toggleFS()">全螢幕</button>

<div class="container">
    <div class="box">
        <h3>YouTube Chat</h3>
        <iframe id="yt"></iframe>
    </div>

    <div class="box">
        <h3>Twitch Chat (jeff_jian_57)</h3>
        <iframe id="tw"></iframe>
    </div>
</div>

<script>
const TWITCH_CHANNEL = "jeff_jian_57";

window.onload = () => {
    document.getElementById("ytId").value =
        localStorage.getItem("ytId") || "";
};

function load() {
    const ytId = document.getElementById("ytId").value;
    const parent = window.location.hostname || "127.0.0.1";

    localStorage.setItem("ytId", ytId);

    if (ytId) {
        document.getElementById("yt").src =
            `https://www.youtube.com/live_chat?v=${ytId}&embed_domain=${parent}`;
    }

    document.getElementById("tw").src =
        `https://www.twitch.tv/embed/${TWITCH_CHANNEL}/chat?parent=${parent}`;
}

function toggleFS() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
