<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播聊天室</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: sans-serif;
    color: #fff;
}

/* 控制列 */
.top-bar {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #111;
}

input {
    flex: 1;
    padding: 14px;
    font-size: 18px;   /* 🔥 大字 */
    border: none;
    border-radius: 10px;
}

button {
    padding: 14px 16px;
    font-size: 18px;   /* 🔥 大按鈕 */
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #9147ff;
    color: #fff;
}

/* 主畫面 */
.container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 70px);
}

.box {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* 標題更大 */
h3 {
    margin: 0;
    padding: 10px;
    font-size: 18px;
    background: #111;
    color: #aaa;
}

/* 聊天區更高 */
iframe {
    flex: 1;
    width: 100%;
    border: none;
}

/* 戶外手機最佳：避免太小 */
@media (max-width: 768px) {
    input {
        font-size: 18px;
    }

    button {
        font-size: 18px;
    }

    h3 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="top-bar">
    <input id="ytId" placeholder="YouTube 影片 ID">
    <button onclick="load()">載入</button>
</div>

<div class="container">

    <div class="box">
        <h3>YouTube Chat</h3>
        <iframe id="yt"></iframe>
    </div>

    <div class="box">
        <h3>Twitch (jeff_jian_57)</h3>
        <iframe id="tw"></iframe>
    </div>

</div>

<script>
const TWITCH_CHANNEL = "jeff_jian_57";

window.onload = () => {
    document.getElementById("ytId").value =
        localStorage.getItem("ytId") || "";
};

function load() {
    const ytId = document.getElementById("ytId").value;
    const parent = window.location.hostname || "127.0.0.1";

    localStorage.setItem("ytId", ytId);

    if (ytId) {
        document.getElementById("yt").src =
            `https://www.youtube.com/live_chat?v=${ytId}&embed_domain=${parent}`;
    }

    document.getElementById("tw").src =
        `https://www.twitch.tv/embed/${TWITCH_CHANNEL}/chat?parent=${parent}`;
}
</script>

</body>
</html>
